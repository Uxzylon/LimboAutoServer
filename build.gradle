plugins {
    id 'java'
}

group = 'fr.jeanney'
version = project.mod_version

base {
    archivesName = 'limboautoserver-velocity'
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'elytrium'
        url = 'https://maven.elytrium.net/repo/'
    }
    maven {
        name = 'sonatype-snapshots'
        url = 'https://oss.sonatype.org/content/repositories/snapshots/'
    }
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:${project.velocity_api_version}"
    annotationProcessor "com.velocitypowered:velocity-api:${project.velocity_api_version}"

    // Provided at runtime by the LimboAPI plugin.
    compileOnly "net.elytrium.limboapi:api:${project.limboapi_version}"
}

def generatedConstantsDir = layout.buildDirectory.dir("generated/sources/buildConstants/java")

tasks.register("generateBuildConstants") {
    inputs.property("version", project.version)
    outputs.dir(generatedConstantsDir)

    doLast {
        def constantsFile = generatedConstantsDir.get().file("fr/jeanney/limboautoserver/BuildConstants.java").asFile
        constantsFile.parentFile.mkdirs()
        constantsFile.text = """package fr.jeanney.limboautoserver;

final class BuildConstants {
    static final String VERSION = "${project.version}";

    private BuildConstants() {
    }
}
"""
    }
}

sourceSets {
    main {
        java.srcDir(generatedConstantsDir)
    }
}

compileJava.dependsOn(tasks.named("generateBuildConstants"))

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
